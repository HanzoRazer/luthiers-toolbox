# DEP-SEC-001A / MAINT-DEFER-004 — active dependency-security intake boundary.
# Monitors only live workspace surfaces. Archived historical package.json files
# under archive/** and docs/archive/** are intentionally NOT listed (they are
# not built, not deployed, and not part of pnpm-workspace packages/*).
# Auto-merge is disabled. Security alerts for proven-dead archives are dismissed
# in GitHub UI as "not used" — see docs/ci/DEPENDABOT_TIER1_REMEDIATION_2026-08-10.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    # Do not group broad upgrades; keep PRs reviewable and Tier-2 majors separate.
    ignore:
      # Major toolchain migration is DEP-SEC Tier-2 — gated on BR-021 / manual witness.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      # TypeScript type-check/lint toolchain. These four move as ONE unit;
      # a lone major bump of any of them breaks the client build.
      # Witnessed on PR #280 (typescript 5.9.3 -> 7.0.2): TypeScript 7 replaced
      # the package-root export with a version stub
      # ("." -> "./lib/version.cjs") and dropped the tsserver bin, so every
      # consumer that does require('typescript') loses the compiler API:
      #   vue-tsc@2            -> ERR_PACKAGE_PATH_NOT_EXPORTED ('./lib/tsc')
      #   @typescript-eslint@6 -> TypeError reading 'Intrinsic'
      #   @vue/compiler-sfc    -> "No fs option provided to compileScript",
      #                           which fails `vite build` and broke the
      #                           Railway @luthiers-toolbox/client deploy.
      # Evidence: docs/ci/DEPENDABOT_TS7_INCOMPATIBILITY_2026-08-17.md
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vue-tsc
        update-types: ["version-update:semver-major"]
      # NOT ignored here, deliberately: eslint (#283) and @typescript-eslint
      # (#282) have live majors in flight, and #282 already carries a manual
      # repair. Adding them would make Dependabot close that work. Their real
      # defect is a different one — #282 bumped @typescript-eslint/eslint-plugin
      # without @typescript-eslint/parser, so npm ci died on ERESOLVE. The fix
      # for that class is a `groups:` entry keeping the two in one PR, which is
      # left for whoever lands #282/#283.
