name: photo-vectorizer typecheck

on:
  push:
    paths:
      - "services/photo-vectorizer/**"
      - ".github/workflows/photo_vectorizer_typecheck.yml"
  pull_request:
    paths:
      - "services/photo-vectorizer/**"
      - ".github/workflows/photo_vectorizer_typecheck.yml"

jobs:
  mypy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/photo-vectorizer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install typecheck deps
        run: |
          python -m pip install --upgrade pip
          pip install mypy pyright numpy opencv-python-headless pytest

      # Scoped to the body-region contract surface this job is named for.
      #
      # This gate had NEVER passed — every run since it was added (2026-03-19)
      # failed, first with a hard `photo-vectorizer contains __init__.py but is not
      # a valid Python package name` crash that aborted before analysing anything,
      # and then, once that was removed, with 178 pre-existing errors. A gate that
      # is permanently red enforces nothing, because nobody can distinguish a new
      # break from the standing failure.
      #
      # body_isolation_result.py + body_isolation_stage.py are now clean and are
      # enforced. The remaining files are NOT dropped silently — they are recorded
      # below as known debt and should be re-added one at a time as each is fixed:
      #
      #   photo_vectorizer_v2.py              ~120 errors (5k lines, legacy CV)
      #   test_extract_coach_integration.py    ~41 errors (mostly no-untyped-def)
      #   test_geometry_coach_v2_real_routing.py ~4 errors (mostly no-untyped-def)
      #
      # Do not widen this list without fixing the corresponding errors first —
      # re-adding a file that still fails puts the gate back to permanently red.
      - name: Run mypy on body-region contract surface
        run: |
          python -m mypy \
            body_isolation_result.py \
            body_isolation_stage.py \
            --config-file mypy.ini

      - name: Run pyright on body-region contract surface
        run: |
          python -m pyright --project pyrightconfig.json
