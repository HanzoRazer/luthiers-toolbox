name: Client Lint & Build

on:
  pull_request:
    paths:
      - "packages/client/**"
      - ".github/workflows/client_lint_build.yml"
  push:
    branches: [main]
    paths:
      - "packages/client/**"
      - ".github/workflows/client_lint_build.yml"

concurrency:
  group: client-lint-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/client/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check (vue-tsc)
        # Intentionally non-gating on its own: 150 type errors pre-date this
        # workflow and are unrelated to any one PR. The ratchet step below is
        # the real gate -- the count may fall freely, but it may not rise.
        # (The former TODO here said "400+"; the measured count on main
        # a48e9002 is 150, identical under typescript 5.9.3 and 6.0.3.)
        continue-on-error: true
        run: npm run type-check 2>&1 | tee "$RUNNER_TEMP/vue-tsc.log"

      - name: Type-check regression ratchet
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_client_type_check_ratchet.py"             --log "$RUNNER_TEMP/vue-tsc.log"             --baseline "$GITHUB_WORKSPACE/scripts/ci/client_type_check_baseline.json"

      - name: Lint (ESLint)
        # Non-gating on its own, and deliberately NOT `npm run lint`: that
        # script carries --max-warnings=1200 against a tree with thousands of
        # warnings, so it failed on warning count every single run and told
        # nobody anything. `lint:report` is the same file selection without
        # the dead threshold; the ratchet step below is the real gate and
        # renders the human-readable summary.
        continue-on-error: true
        run: npm run lint:report -- --output-file "$RUNNER_TEMP/eslint.json"

      - name: Lint regression ratchet
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check_client_lint_ratchet.py"             --report "$RUNNER_TEMP/eslint.json"             --baseline "$GITHUB_WORKSPACE/scripts/ci/client_lint_baseline.json"

      - name: Run tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 7
