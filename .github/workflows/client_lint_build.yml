name: Client Lint & Build

on:
  pull_request:
    paths:
      - "packages/client/**"
      - ".github/workflows/client_lint_build.yml"
  push:
    branches: [main]
    paths:
      - "packages/client/**"
      - ".github/workflows/client_lint_build.yml"

concurrency:
  group: client-lint-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/client/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # BR-021: the type-check lane no longer runs under `continue-on-error: true`
      # (a hollow guarantee — it reported errors but always went green). It is now
      # ratcheted: the known pre-existing errors are frozen as a baseline and the
      # step FAILS on any INCREASE, so a regression (e.g. a TS major-version bump)
      # can no longer pass green. vue-tsc's own non-zero exit is captured (set +e)
      # because the gate — not tsc's exit — decides pass/fail against the baseline.
      - name: Type check (vue-tsc) — ratcheted
        run: |
          set +e
          npm run type-check > /tmp/tsc_report.txt 2>&1
          set -e
          python3 "$GITHUB_WORKSPACE/ci/type_error_gate.py" --report /tmp/tsc_report.txt

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true  # Allow warnings during initial adoption

      - name: Run tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
          retention-days: 7
