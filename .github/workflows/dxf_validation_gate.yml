# DXF Validation Gate
#
# Validates all DXF files in instrument_geometry/ directory.
# This ensures geometry files meet CAM requirements before merge.
#
# Triggered by:
# - Pushes to main
# - Pull requests touching DXF files or instrument_geometry/
#
# Export-readiness contract per asset class, declared in
# services/api/app/ci/dxf_catalog_registry.json (DXF-CATALOG-GATE-001):
# readable, nonempty, geometry_present, version_allowed (R12 only),
# closed_outline, preflight_valid, topology_valid. Files that fall short
# either fail or carry an explicit quarantine record (manufacturing
# authority BLOCKED); there is no warning downgrade.

name: DXF Validation Gate

on:
  push:
    branches: [main]
    paths:
      - 'services/api/app/instrument_geometry/**/*.dxf'
      - 'services/api/app/cam/dxf_*.py'
      - 'services/api/app/ci/check_dxf_files.py'
      - 'services/api/app/ci/dxf_catalog_policy.py'
      - 'services/api/app/ci/dxf_catalog_registry.json'
  pull_request:
    paths:
      - 'services/api/app/instrument_geometry/**/*.dxf'
      - 'services/api/app/cam/dxf_*.py'
      - 'services/api/app/ci/check_dxf_files.py'
      - 'services/api/app/ci/dxf_catalog_policy.py'
      - 'services/api/app/ci/dxf_catalog_registry.json'

jobs:
  validate-dxf:
    name: Validate DXF Files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ezdxf shapely

      - name: Run DXF validation gate
        run: |
          python -m app.ci.check_dxf_files

      - name: Upload validation report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dxf-validation-report
          path: services/api/dxf_validation_report.json
          retention-days: 7
