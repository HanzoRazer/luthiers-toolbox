name: Architecture Scan (Non-Blocking)

on:
  # NO path filter — intentional (CI-RED-004). The "Fence Checks (Blocking)" job
  # below is a REQUIRED status check on main. A required check must report a
  # result on EVERY pull request, or GitHub leaves it permanently "Expected —
  # waiting" and the PR can never merge. A path filter would skip the workflow on
  # docs-only PRs (SPRINTS/ledger/handoff updates are frequent here), silently
  # bricking those merges. The fence job is self-contained — it re-verifies the
  # committed baselines in ratchet mode regardless of which files a PR touches —
  # so on a docs-only PR it runs and passes cheaply. Running on every push to
  # main also records the blocking verdict on every merge commit (the original
  # reason a red fence once reached main under a pull_request-only trigger).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run architecture scan
        run: |
          python scripts/architecture/scan_architecture.py \
            --targets services/api/app packages/client/src \
            --out reports/architecture_scan.json

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture_scan
          path: reports/architecture_scan.json

  fence-checks:
    name: Fence Checks (Blocking)
    runs-on: ubuntu-latest
    continue-on-error: false
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify baseline files exist
        run: |
          test -f services/api/app/ci/fence_baseline.json
          test -f services/api/app/ci/fence_patterns_baseline.json

      - name: Run fence checks (ratchet mode)
        working-directory: services/api
        run: |
          python -m app.ci.check_all_fences

      # Review-queue architecture readiness — REPORT-ONLY during rollout.
      #
      # Deliberately hosted inside Fence Checks (Blocking) rather than in its own
      # workflow. Fence Checks is the sole required status check on this repository and
      # runs on EVERY pull request with no path filter (see the CI-RED-004 note at the top
      # of this file). A separate readiness workflow with path filters would be absent on
      # docs-only PRs, leaving a required check permanently at "Expected — waiting" and
      # bricking those merges — the exact failure mode TD-3 would have reintroduced.
      #
      # --report-only means known readiness gaps do NOT fail this required check. Three of
      # the four ratified requirements are unmet today; enforcing them here would block
      # every merge in the repository, including the PR that adds this step. The report
      # still states NOT_READY truthfully — only enforcement is deferred.
      #
      # An EVALUATOR ERROR still fails: exit code 2 is not suppressed by --report-only.
      # Promotion to enforcement requires a separate owner ruling.
      - name: Review queue readiness (report-only)
        run: |
          python scripts/ci/check_review_queue_readiness.py --report-only --format text
