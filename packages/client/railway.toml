# Config-as-code for the Railway @luthiers-toolbox/client service.
# Root directory for this service is packages/client (set in the Railway UI).
# This file mirrors packages/client/railway.json so a stale dashboard override
# cannot silently switch the PR environment to Railpack/Nixpacks.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
startCommand = "/bin/sh /start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
